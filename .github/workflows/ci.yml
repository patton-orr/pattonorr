name: CI

# main auto-deploys to production, so gate changes on lint + tests + a real
# build (the build is the true typecheck for this project).
on:
  push:
    branches: [main, poc]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
